<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SafeShield - Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

    <h1>🛡️ SafeShield</h1>

    <h2>Create Account</h2>

    {% if error %}

    <p style="color:red;">
        {{ error }}
    </p>

    {% endif %}

    <form method="POST">

        <p>
            <input
                type="text"
                name="name"
                placeholder="Full Name"
                required>
        </p>

        <p>
            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required>
        </p>

        <p>
            <input
                type="password"
                name="password"
                placeholder="Password"
                required>
        </p>

        <button type="submit">
            Create Account
        </button>

    </form>

    <p>
        Already have an account?
        <a href="/login">Login</a>
    </p>

</div>

</body>

</html>
