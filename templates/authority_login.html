<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SafeShield - Authority Login</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #17202a;
            margin: 0;
            padding: 0;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #17202a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        .error {
            color: red;
            text-align: center;
        }

        .info {
            text-align: center;
            color: #555;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>🛡️ SafeShield</h1>

    <h2>👮 Authority Login</h2>

    <p class="info">
        Authorized monitoring personnel only
    </p>

    {% if error %}

        <p class="error">
            {{ error }}
        </p>

    {% endif %}

    <form method="POST">

	<input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <input
            type="email"
            name="email"
            placeholder="Authority Email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            🔐 Authority Login
        </button>

    </form>

    <p class="info">
        SafeShield Emergency Monitoring System
    </p>

</div>

</body>

</html>
